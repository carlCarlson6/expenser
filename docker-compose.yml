name: expenser

services:
  db:
    image: postgres:17-alpine
    container_name: expenser-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expenser
      POSTGRES_PASSWORD: expenser
      POSTGRES_DB: expenser
    ports:
      - "5432:5432"
    volumes:
      - expenser-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenser -d expenser"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  expenser-pgdata:
